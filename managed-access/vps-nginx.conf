# Showcase managed certificate service. Keep this as a separate virtual host.
server {
    listen 80;
    server_name setup.littlepond.eu.org;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/showcase-acme;
        default_type text/plain;
    }
    location / { return 301 https://setup.littlepond.eu.org$request_uri; }
}
server {
    listen 443 ssl;
    server_name setup.littlepond.eu.org;
    ssl_certificate /etc/letsencrypt/live/setup.littlepond.eu.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/setup.littlepond.eu.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 128k;
    access_log off;
    location / {
        proxy_pass http://127.0.0.1:18781;
        proxy_set_header Host setup.littlepond.eu.org;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 35s;
        add_header Cache-Control no-store always;
    }
}
