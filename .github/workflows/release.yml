name: Release

on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and publish
        required: true
        type: string
      runner:
        description: Standard macOS runner
        type: choice
        default: macos-15-intel
        options:
          - macos-15-intel
          - macos-15
          - macos-latest
      publish:
        description: Publish a tagged Release (false validates the supplied ref only)
        type: boolean
        default: true
      compile_only:
        description: Check native compilation without publishing (manual ref validation)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ${{ inputs.runner || 'macos-15-intel' }}
    timeout-minutes: 70
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      CHROME: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish && github.sha || inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify version tag
        shell: bash
        run: |
          set -euo pipefail
          if [ '${{ github.event_name }}' = push ] || [ '${{ inputs.publish }}' = true ]; then
            test "$RELEASE_TAG" = "v$(cat VERSION)"
            test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$(git rev-parse HEAD)"
          fi
          python3 -c 'import tools.build_browser_rootless as b; print(b.DISPLAY_NAME, b.VERSION, b.BUILD_NUMBER)'
      - name: Prepare isolated browser tests
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/browser-tests" playwright@1.56.1
          echo "NODE_PATH=$RUNNER_TEMP/browser-tests/node_modules" >> "$GITHUB_ENV"
          if [ ! -x "$CHROME" ]; then
            "$RUNNER_TEMP/browser-tests/node_modules/.bin/playwright" install chrome
          fi
      - name: Validate native services and browser playback
        if: ${{ !inputs.compile_only }}
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/embed_browser.py
          git diff --exit-code -- source/browser_assets.h
          SHOWCASE_TEST_SOURCE_FPS=10 node tests/test_browser_e2e.cjs
          python3 tests/test_display_profile.py
          python3 tests/test_display_restart.py
          python3 tests/test_control_connect.py
          python3 tests/test_bluetooth_recovery.py
          python3 tests/test_bluetooth_startup.py
          python3 tests/test_iap2_stream.py
          python3 tests/test_bluetooth_bond.py
          python3 tests/test_connection_progress.py
          python3 tests/test_launch_recovery.py
          python3 tests/test_localization.py
          python3 tests/test_browser_packaging.py
          python3 tests/test_browser_bridge.py
          clang tests/test_browser_network.c source/browser_network.c -o "$RUNNER_TEMP/test-browser-network"
          "$RUNNER_TEMP/test-browser-network"
          node tests/test_browser_player.cjs
          node tests/test_browser_stall.cjs
          node tests/test_browser_input.cjs
          node tests/test_browser_live.cjs
          node tests/test_browser_display.cjs
          node tests/test_browser_probe.cjs
          SHOWCASE_TEST_SOURCE_FPS=10 SHOWCASE_TEST_TLS=1 node tests/test_browser_e2e.cjs
          SHOWCASE_TEST_SOURCE_FPS=10 SHOWCASE_TEST_AVC_PROFILE=main node tests/test_browser_e2e.cjs
          SHOWCASE_TEST_SOURCE_FPS=10 SHOWCASE_TEST_AVC_PROFILE=high node tests/test_browser_e2e.cjs
          node tests/test_browser_web_tls.cjs
      - name: Build and verify Dopamine rootless deb
        shell: bash
        run: |
          set -euo pipefail
          upstream_url=$(python3 -c 'import tools.build_browser_rootless as b; print(b.UPSTREAM_URL)')
          curl --fail --location --retry 3 "$upstream_url" --output "$RUNNER_TEMP/upstream.deb"
          python3 tools/build_browser_rootless.py --upstream-deb "$RUNNER_TEMP/upstream.deb"
          cd build/browser-rootless
          shasum -a 256 -c SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: showcase-deb
          path: build/browser-rootless/
          if-no-files-found: error

  package-install:
    needs: release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish && github.sha || inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          name: showcase-deb
          path: build/browser-rootless
      - name: Verify real dpkg fresh and upgrade unpack
        run: |
          set -euo pipefail
          sudo python3 tests/test_browser_packaging.py --deb "build/browser-rootless/com.rostane.showcase_$(cat VERSION)_iphoneos-arm64.deb"

  publish:
    needs: [release, package-install]
    if: ${{ github.event_name == 'push' || (inputs.publish && !inputs.compile_only) }}
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          name: showcase-deb
          path: build/browser-rootless
      - name: Publish verified release assets
        shell: bash
        run: |
          set -euo pipefail
          app_name=$(python3 -c 'import tools.build_browser_rootless as b; print(b.DISPLAY_NAME)')
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "$app_name $RELEASE_TAG" \
              --notes-file docs/RELEASE_NOTES.md
          fi
          gh release upload "$RELEASE_TAG" \
            build/browser-rootless/*.deb \
            build/browser-rootless/SHA256SUMS \
            build/browser-rootless/build-provenance.json \
            docs/BROWSER5.md docs/BROWSER_MODES.md docs/THIRD_PARTY_BROWSER.md docs/PLAYBACK_DIAGNOSTICS.md docs/PLAYBACK_REVIEW.md docs/WIFI_HANDOFF.md --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease \
            --title "$app_name $RELEASE_TAG" \
            --notes-file docs/RELEASE_NOTES.md
          gh release view "$RELEASE_TAG" --json url,assets
