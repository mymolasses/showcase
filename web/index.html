<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Showcase Browser 5</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#000;color:#edf2fa;font:16px system-ui,sans-serif}
#surface{position:absolute;inset:0;touch-action:none;user-select:none;overflow:hidden;background:#000}
video,canvas{position:absolute;width:100%;height:100%;object-fit:fill;pointer-events:none}.contain video,.contain canvas{object-fit:contain}canvas{z-index:1}
#notice{z-index:2;background:#080b1040;position:absolute;inset:0;display:grid;place-content:center;padding:24px;text-align:center;pointer-events:none}
#menu{position:fixed;right:12px;top:12px;z-index:4;opacity:.65}header{position:fixed;left:12px;right:80px;top:12px;z-index:3;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px;background:#151c27e8;border-radius:10px}
#state{flex:1;min-width:120px;font-size:14px}button{font:inherit;border:0;border-radius:8px;padding:10px 14px;color:#fff;background:#285bbe;cursor:pointer}
[hidden]{display:none!important}
</style>
<main id="surface"><canvas id="poster" hidden></canvas><video muted autoplay playsinline disablepictureinpicture></video><div id="notice">正在连接 CarPlay…</div></main>
<button id="menu" aria-label="显示或隐藏控制菜单">菜单</button>
<header id="toolbar" hidden><span id="state">正在连接</span><button id="reconnect">重连</button><button id="fit">显示：填满</button><button id="fullscreen">全屏</button><button id="disconnect">断开</button></header>
<script src="/player.js" defer></script>
</html>
