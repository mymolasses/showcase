<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Showcase+</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#000;color:#edf2fa;font:16px system-ui,sans-serif}
#surface{position:absolute;inset:0;touch-action:none;user-select:none;overflow:hidden;background:#000}
#display{position:absolute;inset:0}canvas{position:absolute;width:100%;height:100%;object-fit:cover;pointer-events:none}.contain canvas{object-fit:contain}#poster{z-index:1}
#notice{z-index:2;background:#080b1040;position:absolute;inset:0;display:grid;place-content:center;padding:24px;text-align:center;pointer-events:none}
#menu{position:fixed;right:12px;top:12px;z-index:4;opacity:.65}header{position:fixed;left:12px;right:80px;top:12px;z-index:3;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px;background:#151c27e8;border-radius:10px}
#state{flex:1;min-width:120px;font-size:14px}button,select{font:inherit;border:0;border-radius:8px;padding:10px 14px;color:#fff;background:#285bbe;cursor:pointer}select{max-width:240px}
#display-hint{width:100%;font-size:13px;color:#bdc9da}header label{display:flex;gap:6px;align-items:center}
#diagnostic-panel{position:fixed;z-index:5;top:76px;right:12px;width:440px;max-width:calc(100% - 24px);max-height:calc(100% - 90px);overflow:auto;background:#101824f2;padding:16px;border-radius:12px;font-size:13px;user-select:text}
#diagnostic-panel pre{white-space:pre-wrap;overflow-wrap:anywhere}#diagnostic-panel p{color:#bdc9da;line-height:1.5}
[hidden]{display:none!important}
</style>
<body class="contain"><main id="surface"><div id="display"></div><canvas id="poster" hidden></canvas><div id="notice">正在连接 CarPlay…</div></main>
<button id="menu" aria-label="显示或隐藏控制菜单">菜单</button>
<header id="toolbar" hidden><span id="state">正在连接</span><label>输出比例 <select id="output-resolution" aria-label="CarPlay 输出比例"><option value="auto">自动适配车机浏览器（默认）</option><option value="phone">适配手机屏幕</option><option value="1920x1080">1920 × 1080 · 16:9</option><option value="1600x900">1600 × 900 · 16:9</option><option value="1280x720">1280 × 720 · 16:9</option><option value="1600x1000">1600 × 1000 · 16:10</option><option value="1440x1080">1440 × 1080 · 4:3</option><option value="1920x960">1920 × 960 · 2:1</option><option value="1920x720">1920 × 720 · 8:3</option></select></label><button id="reconnect">重连</button><button id="fit">显示：完整</button><button id="diagnostics">诊断</button><button id="fullscreen">全屏</button><button id="disconnect">断开</button><span id="display-hint">默认完整显示；改变输出比例会自动重连 CarPlay。</span></header>
<aside id="diagnostic-panel" hidden aria-label="播放诊断"><strong>播放诊断</strong> <button id="diagnostic-copy">复制诊断</button> <button id="diagnostic-close">关闭</button><p>使用可信 HTTPS/WSS，Worker 内 WebCodecs 解码与 WebGL2 绘制。presentedFps 是有效绘制帧率，不等于画面内容变化；音频继续走手机蓝牙。请驻车后配置与导出诊断。</p><pre id="diagnostic-data"></pre></aside>
<script src="/protocol.js" defer></script><script src="/renderers.js" defer></script><script src="/player.js" defer></script>
</html>
