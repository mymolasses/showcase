<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Showcase+</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#000;color:#edf2fa;font:16px system-ui,sans-serif}
#surface{position:absolute;inset:0;touch-action:none;user-select:none;overflow:hidden;background:#000}
#display{position:absolute;inset:0}video,canvas,#display img{position:absolute;width:100%;height:100%;object-fit:fill;pointer-events:none}.contain video,.contain canvas,.contain #display img{object-fit:contain}#poster{z-index:1}
#notice{z-index:2;background:#080b1040;position:absolute;inset:0;display:grid;place-content:center;padding:24px;text-align:center;pointer-events:none}
#menu{position:fixed;right:12px;top:12px;z-index:4;opacity:.65}header{position:fixed;left:12px;right:80px;top:12px;z-index:3;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px;background:#151c27e8;border-radius:10px}
#state{flex:1;min-width:120px;font-size:14px}button,select{font:inherit;border:0;border-radius:8px;padding:10px 14px;color:#fff;background:#285bbe;cursor:pointer}select{max-width:240px}
#diagnostic-panel{position:fixed;z-index:5;top:76px;right:12px;width:440px;max-width:calc(100% - 24px);max-height:calc(100% - 90px);overflow:auto;background:#101824f2;padding:16px;border-radius:12px;font-size:13px;user-select:text}
#diagnostic-panel pre{white-space:pre-wrap;overflow-wrap:anywhere}#diagnostic-panel p{color:#bdc9da;line-height:1.5}
[hidden]{display:none!important}
</style>
<main id="surface"><div id="display"></div><canvas id="poster" hidden></canvas><div id="notice">正在连接 CarPlay…</div></main>
<button id="menu" aria-label="显示或隐藏控制菜单">菜单</button>
<header id="toolbar" hidden><span id="state">正在连接</span><select id="renderer" aria-label="显示方式"><option value="jpeg">JPEG Canvas（默认）</option><option value="mjpeg">MJPEG Image</option><option value="webcodecs">WebCodecs Canvas</option><option value="software">Software Canvas（Baseline）</option><option value="webrtc">WebRTC Canvas（实验）</option></select><button id="reconnect">重连</button><button id="fit">显示：填满</button><button id="diagnostics">诊断</button><button id="fullscreen">全屏</button><button id="disconnect">断开</button></header>
<aside id="diagnostic-panel" hidden aria-label="播放诊断"><strong>播放诊断</strong> <button id="diagnostic-copy">复制诊断</button> <button id="diagnostic-close">关闭</button><p>presentedFps：解码后绘制帧率，不等于屏幕内容变化。MJPEG 无法准确计数时显示 null。receiver 是手机端统计，不能当作网页出帧。所有模式保留触摸，音频继续走手机蓝牙。请驻车后切换与诊断。</p><pre id="diagnostic-data"></pre></aside>
<script src="/protocol.js" defer></script><script src="/renderers.js" defer></script><script src="/player.js" defer></script>
</html>
