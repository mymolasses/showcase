<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Showcase Browser 4</title>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0;background:#080b10;color:#edf2fa;font:16px system-ui,sans-serif}
body{display:flex;flex-direction:column}header{display:flex;gap:12px;align-items:center;padding:10px 16px;background:#151c27}
h1{font-size:17px;margin:0}#state{flex:1;font-size:14px;color:#abb8ca}button,input{font:inherit;border:0;border-radius:8px;padding:10px 14px}
button{color:#fff;background:#285bbe;cursor:pointer}button:disabled{opacity:.5}#pair{margin:auto;padding:28px;max-width:650px}
#pair label{display:block;margin:20px 0 8px}input{width:100%;background:#222c3c;color:#fff;font-family:monospace;margin-bottom:14px}
p{line-height:1.6;color:#b7c4d6}#surface{position:relative;flex:1;min-height:0;touch-action:none;user-select:none;overflow:hidden;background:#000}
video,canvas{position:absolute;width:100%;height:100%;object-fit:contain;pointer-events:none}canvas{z-index:1}#notice{z-index:2;background:#080b1040;position:absolute;inset:0;display:grid;place-content:center;padding:24px;text-align:center;pointer-events:none}
[hidden]{display:none!important}:fullscreen header{display:none}
</style>
<header><h1>Showcase</h1><span id="state">未连接</span><button id="reconnect" hidden>重连</button><button id="fullscreen">全屏</button><button id="disconnect" hidden>断开</button></header>
<form id="pair">
  <h2>连接 CarPlay</h2>
  <p>车机与发送 CarPlay 的 iPhone 均连接 Showcase 接收机热点。保持接收机上的 Showcase 在前台运行。</p>
  <label for="token">四位配对码（接收机 Settings → Display）</label>
  <input id="token" type="text" inputmode="numeric" pattern="[0-9]{4}" autocomplete="off" spellcheck="false" minlength="4" maxlength="4" placeholder="0000" required>
  <button type="submit">连接</button>
  <p>原型支持画面和单指操作。声音请在发送 iPhone 上选择车载蓝牙。首次配置请停车完成。</p>
</form>
<main id="surface" hidden><canvas id="poster" hidden></canvas><video muted autoplay playsinline disablepictureinpicture></video><div id="notice">等待 CarPlay 画面…</div></main>
<script src="/player.js" defer></script>
</html>
